<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product videos</title>
<style>
  :root { --bg:#f6f4ef; --ink:#222; --mute:#777; --line:#ddd6c8; --red:#b3261e; --redbg:#fbe4e2; --amber:#8a5300; --amberbg:#fff3d6; --ok:#1f7a3a; --okbg:#e3f3e7; --blue:#2b5fb3; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, Segoe UI, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { position:sticky; top:0; z-index:5; display:flex; gap:10px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); background:#fff; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tabs button { border:1px solid var(--line); background:#fff; padding:5px 11px; cursor:pointer; border-radius:6px; font-size:13px; }
  .tabs button.on { background:#222; color:#fff; border-color:#222; }
  .tabs .n { opacity:.7; margin-left:4px; }
  .grow { flex:1; }
  .mute { color:var(--mute); font-size:12px; }
  input, select { padding:4px 6px; border:1px solid var(--line); border-radius:5px; background:#fff; font-size:13px; }
  a.btn, button.btn { border:1px solid var(--line); background:#fff; padding:5px 10px; border-radius:6px; cursor:pointer; color:inherit; text-decoration:none; font-size:13px; }
  .intro { padding:8px 14px; font-size:12.5px; color:#555; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; padding:4px 14px 40px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
  .card.approved { outline:3px solid var(--ok); }
  .card.rejected { outline:3px solid var(--red); }
  .thumb { position:relative; background:#ece8df; display:flex; justify-content:center; align-items:center; height:260px; cursor:pointer; }
  .thumb img { display:block; max-width:100%; max-height:260px; }
  .thumb .play { position:absolute; width:54px; height:54px; border-radius:50%; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; }
  .thumb .play::after { content:""; border-left:18px solid #fff; border-top:11px solid transparent; border-bottom:11px solid transparent; margin-left:4px; }
  .thumb .dur { position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.7); color:#fff; font-size:11.5px; padding:1px 6px; border-radius:4px; }
  .meta { padding:7px 9px 4px; font-size:12px; }
  .meta b { font-size:13px; }
  .lvl { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:1px 6px; border-radius:4px; margin-left:4px; background:#eee; color:#555; }
  .lvl.approved { background:var(--okbg); color:var(--ok); }
  .lvl.rejected { background:var(--redbg); color:var(--red); }
  .lvl.rev { background:#e8eef9; color:var(--blue); }
  .pitch { padding:0 9px 6px; font-size:12px; color:#555; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .cnote { margin:0 9px 6px; padding:5px 7px; border-radius:6px; background:var(--amberbg); border:1px solid #f0d29a; font-size:12px; white-space:pre-wrap; word-break:break-word; }
  .cnote b { color:var(--amber); }
  .acts { margin-top:auto; display:flex; gap:6px; padding:7px 9px 9px; }
  .acts button { flex:1; border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px; cursor:pointer; font-size:12.5px; }
  .acts button.ap.on { background:var(--ok); color:#fff; border-color:var(--ok); }
  .acts button.rj.on { background:var(--red); color:#fff; border-color:var(--red); }
  .acts button.nt.on { background:var(--amber); color:#fff; border-color:var(--amber); }
  .ned { padding:0 9px 9px; display:flex; flex-direction:column; gap:6px; }
  .card .ned { display:none; }
  .card.editing .ned { display:flex; }
  .ntext { width:100%; min-height:60px; font:inherit; font-size:12.5px; padding:6px; border:1px solid var(--line); border-radius:6px; resize:vertical; }
  .nrow { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .nrow .btn { padding:4px 9px; font-size:12px; }
  .btn.live { background:var(--red); color:#fff; border-color:var(--red); }
  .empty { padding:40px; text-align:center; color:var(--mute); grid-column:1/-1; }
  #viewer { position:fixed; inset:0; background:rgba(20,18,15,.94); z-index:20; display:none; color:#fff; }
  #viewer.open { display:flex; }
  #viewer .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:16px; min-width:0; }
  #viewer video { max-width:calc(100vw - 400px); max-height:calc(100vh - 32px); background:#000; border-radius:6px; }
  #viewer .side { width:360px; background:#1d1b18; padding:16px; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  #viewer h2 { margin:0; font-size:18px; }
  #viewer .pitch { padding:0; color:#ccc; -webkit-line-clamp:unset; }
  #viewer textarea { width:100%; min-height:90px; font:inherit; font-size:13px; padding:6px; border-radius:6px; border:1px solid #555; background:#2a2723; color:#fff; }
  #viewer .acts { padding:0; margin-top:0; }
  #viewer .acts button { background:#2a2723; color:#ddd; border-color:#555; }
  #viewer .acts button.ap.on { background:var(--ok); border-color:var(--ok); color:#fff; }
  #viewer .acts button.rj.on { background:var(--red); border-color:var(--red); color:#fff; }
  #viewer .acts button:disabled { opacity:.35; cursor:default; }
  #viewer .btn { background:#2a2723; color:#ddd; border-color:#555; }
  #viewer .btn.live { background:var(--red); border-color:var(--red); color:#fff; }
  #viewer .ned { padding:0; }
  #viewer .keys { font-size:12px; color:#aaa; line-height:1.8; }
  kbd { border:1px solid #888; border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:11px; }
  #viewer .close { align-self:flex-end; background:none; border:0; color:#fff; font-size:22px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Product videos</h1>
  <div class="tabs" id="tabs"></div>
  <span class="grow"></span>
  <select id="product"><option value="">All products</option></select>
  <select id="ratio"><option value="">All ratios</option><option value="9x16">9:16</option><option value="1x1">1:1</option><option value="16x9">16:9</option></select>
  <input id="q" placeholder="Search title, idea or comment" size="22">
  <span class="mute" id="progress"></span>
  <span class="mute" id="save"></span>
  <a class="btn" href="export">Export decisions</a>
</header>
<div class="intro" id="intro"></div>
<div id="grid"></div>
<div id="viewer">
  <div class="stage" id="stage"></div>
  <div class="side" id="side"></div>
</div>
<script>
const rerendered = (i, fb) => !!fb?.status && !!fb.at && i.mtime > fb.at;
const TABS = [
  { id: "todo", label: "To review", test: (i, f) => !f[i.key]?.status || rerendered(i, f[i.key]),
    intro: "Click a video to play it. Approve the ones to publish, reject the rest, and add a comment for anything to change. Re-rendered videos come back here." },
  { id: "approved", label: "Approved", test: (i, f) => f[i.key]?.status === "approved", intro: "Approved videos. These are the ones to upload and add to the Google feed." },
  { id: "rejected", label: "Rejected", test: (i, f) => f[i.key]?.status === "rejected", intro: "Rejected videos. A comment says what would make them work." },
  { id: "comments", label: "With comments", test: (i, f) => !!f[i.key]?.note, intro: "Every video with a comment, approved or not." },
  { id: "all", label: "All", test: () => true, intro: "All rendered videos." },
];
const RATIO = { "9x16": "9:16", "1x1": "1:1", "16x9": "16:9" };
let items = [], byKey = new Map(), feedback = {}, tab = "todo", shown = [], current = -1;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function load() {
  const r = await fetch("api/items");
  const d = await r.json();
  if (!r.ok) { $("grid").innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  items = d.items;
  byKey = new Map(items.map((i) => [i.key, i]));
  feedback = d.feedback || {};
  const products = [...new Map(items.map((i) => [i.folder, i])).values()];
  $("product").innerHTML = `<option value="">All products (${products.length})</option>` + products.map((p) => `<option value="${esc(p.folder)}">${esc(p.folder)}</option>`).join("");
  render();
}

function filtered(t) {
  const q = $("q").value.trim().toLowerCase(), product = $("product").value, ratio = $("ratio").value;
  const def = TABS.find((x) => x.id === t);
  return items.filter((i) => def.test(i, feedback) && (!product || i.folder === product) && (!ratio || i.ratio === ratio)
    && (!q || `${i.title} ${i.pitch} ${i.folder} ${feedback[i.key]?.note || ""}`.toLowerCase().includes(q)));
}

function badges(i, fb) {
  return (fb.status ? `<span class="lvl ${fb.status}">${fb.status}</span>` : "") + (rerendered(i, fb) ? '<span class="lvl rev">Re-rendered</span>' : "");
}
function noteHtml(fb) { return fb.note ? `<div class="cnote"><b>Comment:</b> ${esc(fb.note)}</div>` : ""; }
function editorHtml(i) {
  const fb = feedback[i.key] || {};
  return `<div class="ned" data-key="${esc(i.key)}">
    <textarea class="ntext" placeholder="What to change, e.g. hold the end card longer, caption too small, swap the music">${esc(fb.note || "")}</textarea>
    <div class="nrow"><button type="button" class="btn" data-savenote>Save comment</button>${rec ? '<button type="button" class="btn" data-mic>Mic</button>' : ""}<span class="mute">Ctrl+Enter saves</span></div>
  </div>`;
}
function cardHtml(i, n) {
  const fb = feedback[i.key] || {}, st = fb.status || "";
  return `<div class="card ${st}" data-n="${n}" data-key="${esc(i.key)}">
    <div class="thumb" data-open="${n}"><img loading="lazy" src="thumb?key=${encodeURIComponent(i.key)}&v=${encodeURIComponent(i.mtime)}" alt=""><span class="play"></span><span class="dur">${RATIO[i.ratio] || i.ratio} · ${i.duration}s</span></div>
    <div class="meta"><b>${i.id}. ${esc(i.title)}</b>${badges(i, fb)}<br><span class="mute">${esc(i.number)} ${esc(i.product)}</span></div>
    <div class="pitch">${esc(i.pitch)}</div>
    ${noteHtml(fb)}
    <div class="acts"><button class="ap ${st === "approved" ? "on" : ""}" data-set="approved" data-n="${n}">Approve</button><button class="rj ${st === "rejected" ? "on" : ""}" data-set="rejected" data-n="${n}">Reject</button><button class="nt ${fb.note ? "on" : ""}" data-note="${n}">Comment</button></div>
    ${editorHtml(i)}
  </div>`;
}

function renderTabs() {
  $("tabs").innerHTML = TABS.map((t) => `<button data-tab="${t.id}" class="${t.id === tab ? "on" : ""}">${t.label}<span class="n">${filtered(t.id).length}</span></button>`).join("");
  const scope = items.filter((i) => !$("product").value || i.folder === $("product").value);
  const ap = scope.filter((i) => feedback[i.key]?.status === "approved").length, rj = scope.filter((i) => feedback[i.key]?.status === "rejected").length;
  $("progress").textContent = `${scope.length} videos · ${ap} approved · ${rj} rejected · ${scope.length - ap - rj} to review`;
}
function render() {
  stopMic();
  renderTabs();
  $("intro").textContent = TABS.find((x) => x.id === tab).intro;
  shown = filtered(tab);
  $("grid").innerHTML = shown.length ? shown.map(cardHtml).join("") : '<div class="empty">Nothing here.</div>';
}

// Saves for one video run in order, so a blur save and a button press never race.
const queues = {};
function enqueue(key, fn) {
  const run = (queues[key] || Promise.resolve()).then(fn);
  queues[key] = run.catch(() => {});
  return run;
}
async function post(i, entry) {
  $("save").textContent = "Saving...";
  const r = await fetch("api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: i.key, entry }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $("save").textContent = d.error || "Save failed"; return false; }
  if (d.entry) feedback[i.key] = d.entry; else delete feedback[i.key];
  $("save").textContent = "Saved";
  return true;
}
function decide(i, status) {
  return enqueue(i.key, async () => {
    const prev = feedback[i.key] || {};
    // Pressing the same decision again on a re-rendered video confirms it rather than clearing it.
    const next = prev.status === status && !rerendered(i, prev) ? null : status;
    return post(i, next || prev.note ? { status: next, note: prev.note || "" } : null);
  });
}
function saveEditor(ed, close) {
  const i = byKey.get(ed.dataset.key);
  if (!i) return Promise.resolve(false);
  return enqueue(i.key, async () => {
    const prev = feedback[i.key] || {};
    const note = ed.querySelector(".ntext").value.trim();
    let changed = false;
    if (note !== (prev.note || "")) changed = await post(i, note || prev.status ? { status: prev.status || null, note } : null);
    refreshAfter(i, ed, close);
    return changed;
  });
}
function refreshAfter(i, ed, close) {
  if (ed.closest("#viewer")) paintViewer(i);
  else {
    const card = ed.closest(".card");
    if (card) { paintCard(card, i); if (close) card.classList.remove("editing"); }
  }
  renderTabs();
}
function paintCard(card, i) {
  const fb = feedback[i.key] || {}, st = fb.status || "";
  card.classList.remove("approved", "rejected");
  if (st) card.classList.add(st);
  card.querySelector(".ap").classList.toggle("on", st === "approved");
  card.querySelector(".rj").classList.toggle("on", st === "rejected");
  card.querySelector(".nt").classList.toggle("on", !!fb.note);
  card.querySelector(".meta").innerHTML = `<b>${i.id}. ${esc(i.title)}</b>${badges(i, fb)}<br><span class="mute">${esc(i.number)} ${esc(i.product)}</span>`;
  card.querySelector(".cnote")?.remove();
  const h = noteHtml(fb);
  if (h) card.querySelector(".acts").insertAdjacentHTML("beforebegin", h);
}

// Speech to text (Edge and Chrome) into whichever comment box has the mic on.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, micTarget = null;
if (SR) {
  rec = new SR(); rec.lang = "en-IN"; rec.continuous = true; rec.interimResults = false;
  rec.onresult = (e) => {
    for (let k = e.resultIndex; k < e.results.length; k++) {
      if (!e.results[k].isFinal || !micTarget) continue;
      micTarget.value = (micTarget.value ? micTarget.value + " " : "") + e.results[k][0].transcript.trim();
    }
  };
  rec.onend = () => { if (micTarget) rec.start(); };
}
function toggleMic(btn) {
  if (!rec) return;
  const ta = btn.closest(".ned").querySelector(".ntext"), running = !!micTarget;
  document.querySelectorAll("[data-mic].live").forEach((b) => b.classList.remove("live"));
  if (micTarget === ta) { stopMic(); saveEditor(ta.closest(".ned"), false); return; }
  micTarget = ta;
  btn.classList.add("live");
  if (!running) rec.start();
}
function stopMic() {
  if (!micTarget) return;
  micTarget = null;
  rec.stop();
  document.querySelectorAll("[data-mic].live").forEach((b) => b.classList.remove("live"));
}

function openViewer(n) {
  if (n < 0 || n >= shown.length) return;
  stopMic();
  current = n;
  const i = shown[n];
  $("viewer").classList.add("open");
  $("stage").innerHTML = `<video id="vid" src="video?key=${encodeURIComponent(i.key)}&v=${encodeURIComponent(i.mtime)}" controls autoplay loop playsinline></video>`;
  $("side").innerHTML = `<button class="close" id="vclose" title="Close (Esc)">×</button>
    <h2 id="vtitle"></h2>
    <div>${esc(i.number)} ${esc(i.product)}</div>
    <div class="mute">${RATIO[i.ratio] || i.ratio} · ${i.duration}s · ${i.mb} MB · ${n + 1} of ${shown.length}</div>
    <div class="pitch">${esc(i.pitch)}</div>
    <div class="acts"><button class="ap" id="vap">Approve (A)</button><button class="rj" id="vrj">Reject (R)</button></div>
    <div class="acts"><button id="vprev" ${n > 0 ? "" : "disabled"}>← Previous</button><button id="vnext" ${n < shown.length - 1 ? "" : "disabled"}>Next video →</button></div>
    <div><b>Comment</b></div>
    ${editorHtml(i)}
    <div class="keys"><kbd>A</kbd> approve &nbsp; <kbd>R</kbd> reject &nbsp; <kbd>C</kbd> comment &nbsp; <kbd>Space</kbd> play / pause<br><kbd>←</kbd> <kbd>→</kbd> previous / next &nbsp; <kbd>Esc</kbd> close</div>`;
  $("vclose").onclick = closeViewer;
  $("vap").onclick = () => setInViewer("approved");
  $("vrj").onclick = () => setInViewer("rejected");
  $("vprev").onclick = () => stepViewer(-1);
  $("vnext").onclick = () => stepViewer(1);
  paintViewer(i);
}
function paintViewer(i) {
  const fb = feedback[i.key] || {};
  $("vtitle").innerHTML = `${i.id}. ${esc(i.title)} ${badges(i, fb)}`;
  $("vap").classList.toggle("on", fb.status === "approved");
  $("vrj").classList.toggle("on", fb.status === "rejected");
}
async function setInViewer(status) {
  const i = shown[current], ed = $("side").querySelector(".ned");
  if (ed) await saveEditor(ed, false);
  await decide(i, status);
  renderTabs();
  if (feedback[i.key]?.status && current < shown.length - 1) openViewer(current + 1); else paintViewer(i);
}
async function stepViewer(d) {
  const ed = $("side").querySelector(".ned");
  if (ed) await saveEditor(ed, false);
  openViewer(current + d);
}
async function closeViewer() {
  const ed = $("side").querySelector(".ned");
  if (ed) await saveEditor(ed, false);
  $("stage").innerHTML = "";
  $("viewer").classList.remove("open"); current = -1; render();
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-tab],[data-set],[data-open],[data-note],[data-savenote],[data-mic]");
  if (!t) return;
  const ed = t.closest(".ned");
  if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (t.dataset.set) {
    const i = shown[+t.dataset.n];
    await decide(i, t.dataset.set);
    paintCard(t.closest(".card"), i);
    renderTabs();
  } else if (t.dataset.note) {
    const card = t.closest(".card");
    card.classList.toggle("editing");
    if (card.classList.contains("editing")) card.querySelector(".ntext").focus();
  } else if (t.hasAttribute("data-savenote")) { stopMic(); saveEditor(ed, true); }
  else if (t.hasAttribute("data-mic")) toggleMic(t);
  else if (t.dataset.open) openViewer(+t.dataset.open);
});
document.addEventListener("focusout", (e) => {
  if (e.target.classList?.contains("ntext") && e.target !== micTarget) saveEditor(e.target.closest(".ned"), false);
});
document.addEventListener("keydown", (e) => {
  if (e.target.classList?.contains("ntext")) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); stopMic(); saveEditor(e.target.closest(".ned"), true); }
    else if (e.key === "Escape") e.target.blur();
    return;
  }
  if (current < 0 || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase(), vid = $("vid");
  if (k === "escape") closeViewer();
  else if (k === "arrowright") stepViewer(1);
  else if (k === "arrowleft") stepViewer(-1);
  else if (k === "a") setInViewer("approved");
  else if (k === "r") setInViewer("rejected");
  else if (k === "c") { e.preventDefault(); $("side").querySelector(".ntext")?.focus(); }
  else if (k === " " && vid && e.target !== vid) { e.preventDefault(); vid.paused ? vid.play() : vid.pause(); }
});
["q", "product", "ratio"].forEach((id) => $(id).addEventListener("input", render));
window.addEventListener("pagehide", () => {
  // Only open editors: hidden card editors can hold an older note than one saved from the viewer.
  for (const ed of document.querySelectorAll(".card.editing .ned, #viewer.open .ned")) {
    const i = byKey.get(ed.dataset.key), prev = feedback[i?.key] || {};
    const note = ed.querySelector(".ntext").value.trim();
    if (!i || note === (prev.note || "")) continue;
    navigator.sendBeacon("api/feedback", new Blob([JSON.stringify({ key: i.key, entry: { status: prev.status || null, note } })], { type: "application/json" }));
  }
});
load();
</script>
</body>
</html>
